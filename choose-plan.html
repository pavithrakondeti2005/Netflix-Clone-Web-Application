<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose Your Plan | StreamFlix</title><link rel="stylesheet" href="style.css"></head><body class="auth-page"><header class="simple-nav"><a class="brand" href="landing.html">STREAMFLIX</a><a class="nav-login" href="signin.html">Sign Out</a></header><main class="subscription-page"><div class="subscription-head"><div class="eyebrow">STEP 2 OF 4</div><h1>Choose your plan</h1><p>No extra fees. Change or cancel your plan anytime.</p></div><div class="sub-grid" id="plans"><label class="sub-card"><input type="radio" name="plan" value="Mobile" data-price="149"><span class="sub-name">Mobile</span><strong>₹149 <small>/month</small></strong><span>480p</span><span>Phone & tablet</span><span>1 device at a time</span></label><label class="sub-card"><input type="radio" name="plan" value="Basic" data-price="199"><span class="sub-name">Basic</span><strong>₹199 <small>/month</small></strong><span>720p</span><span>All devices</span><span>1 device at a time</span></label><label class="sub-card selected"><b class="popular-badge">POPULAR</b><input type="radio" name="plan" value="Standard" data-price="499" checked><span class="sub-name">Standard</span><strong>₹499 <small>/month</small></strong><span>1080p Full HD</span><span>All devices</span><span>2 devices at a time</span></label><label class="sub-card"><input type="radio" name="plan" value="Premium" data-price="649"><span class="sub-name">Premium</span><strong>₹649 <small>/month</small></strong><span>4K + HDR</span><span>All devices</span><span>4 devices at a time</span></label></div><div class="sub-bottom"><span>Step 2 complete when you select a plan.</span><button class="primary-btn" id="goPayment">Continue</button></div></main><script>const cards=document.querySelectorAll('.sub-card');cards.forEach(c=>c.onclick=()=>{cards.forEach(x=>x.classList.remove('selected'));c.classList.add('selected');c.querySelector('input').checked=true});goPayment.onclick=()=>{let x=document.querySelector('input[name=plan]:checked');localStorage.setItem('plan',x.value);localStorage.setItem('price',x.dataset.price);location.href='payment.html'}</script></body></html>
